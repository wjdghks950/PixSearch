name: CPU smoke checks
on: [push, pull_request]
jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m unittest discover -s tests -v
      - name: Check tracked Python and shell syntax
        run: |
          python - <<'PY'
          import ast, pathlib, subprocess
          for filename in subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines():
              ast.parse(pathlib.Path(filename).read_text(), filename=filename)
          for filename in subprocess.check_output(['git', 'ls-files', '*.sh'], text=True).splitlines():
              subprocess.run(['bash', '-n', filename], check=True)
          PY
